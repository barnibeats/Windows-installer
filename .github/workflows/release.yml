# Build on every push / pull request (artifact + self-test).
# Push a tag v* (e.g. v1.0.0) to publish a release: WindowsInstaller.exe + latest.json.
# Installed copies read latest.json from the newest release and update themselves.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" -replace '^v','' }
          else {
            $t = (git describe --tags --abbrev=0 2>$null); $global:LASTEXITCODE = 0; if (-not $t) { $t = "0.0.0" }
            $v = ($t -replace '^v','') + "-dev"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version: $v"

      - name: Build
        shell: powershell
        run: .\build.ps1 -Version "${{ steps.ver.outputs.version }}" -Repo "${{ github.repository }}"

      - name: Self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\WindowsInstaller.exe -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsInstaller
          path: WindowsInstaller.exe

      - name: Create latest.json
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $f = Get-Item WindowsInstaller.exe
          $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $json = [ordered]@{ version = $tag; url = "https://github.com/$repo/releases/download/$tag/WindowsInstaller.exe"; size = $f.Length; sha256 = $sha } | ConvertTo-Json
          Set-Content -Encoding UTF8 latest.json $json
          Get-Content latest.json

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Windows Installer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            WindowsInstaller.exe
            latest.json
